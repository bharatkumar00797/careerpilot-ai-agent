[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "careerpilot-ai-agent"
version = "0.1.0"
description = "Personal AI career agent: fit scoring, skill-gap plans, interview prep, and tailored application packages from a structured profile and job description."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Bharatkumar Chandvani" }]
requires-python = ">=3.11"
keywords = ["ai", "llm", "ai-agents", "career", "resume", "job-matching", "interview-prep"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
careerpilot = "careerpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/careerpilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/careerpilot/data" = "careerpilot/data"
"src/careerpilot/api/static" = "careerpilot/api/static"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/careerpilot"]
